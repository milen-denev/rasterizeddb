name: CI

# Every push and pull request: the four release targets build, the crates
# that ship (rastcp, the client, the embedded SDK) pass their tests on each,
# and their public API stays compatible with the last release (semver).
# The engine's own suites are long (the core library alone is ~10 minutes on
# 16 cores); they run on every target in the `full` job: weekly, on demand
# (Actions -> CI -> Run workflow, full = true), and on pushes to the
# release branch.

on:
  # dev is where work lands; main and release only ever take commits whose
  # checks already ran (a release pull request, then a fast-forward).
  push:
    branches: [dev]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the engine's full test suites on every target"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The engine's futures run on 32 MiB stacks in production; tests match.
  # (.cargo/config.toml sets this too; repeated so a cached cargo sees it.)
  RUST_MIN_STACK: "33554432"
  RUST_BACKTRACE: "1"

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}

      - name: Build the server
        run: cargo build --locked --target ${{ matrix.target }} -p rasterizeddb_core --bin rasterizeddb_core

      - name: Every target compiles (tests, examples, benches)
        run: cargo check --locked --target ${{ matrix.target }} --workspace --all-targets

      # The workspace check above unifies features: another member asks for
      # the engine's defaults, so a feature-less engine is never compiled
      # there. Checked on its own here, then with each default feature alone,
      # so a module that uses another feature's code without declaring it
      # fails CI instead of the next crate that turns the defaults off (it
      # went unseen from 2026-11-09 to 2026-11-21).
      - name: The engine builds without its optional features, and with each alone
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --target ${{ matrix.target }} -p rasterizeddb_core --no-default-features --all-targets
          for feature in $(cargo metadata --locked --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name == "rasterizeddb_core") | .features.default[]'); do
            echo "::group::rasterizeddb_core with only $feature"
            cargo check --locked --target ${{ matrix.target }} -p rasterizeddb_core --no-default-features --features "$feature" --lib
            echo "::endgroup::"
          done

      - name: Test rastcp, the client and the embedded SDK
        run: >
          cargo test --locked --target ${{ matrix.target }}
          -p rastcp -p rasterizeddb_client -p rasterizeddb_client_derive -p rasterizeddb_embedded

      - name: Client live tests against this build's server (unix only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export RDB_SERVER_BIN="$PWD/target/${{ matrix.target }}/debug/rasterizeddb_core"
          cargo test --locked --target ${{ matrix.target }} -p rasterizeddb_client --all-features

      - name: Server smoke test (start, write, kill -9, restart, read)
        shell: bash
        run: |
          cargo build --locked --target ${{ matrix.target }} -p rasterizeddb_client --example quickstart
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          bash .github/scripts/smoke.sh \
            "target/${{ matrix.target }}/debug/rasterizeddb_core$ext" \
            "target/${{ matrix.target }}/debug/examples/quickstart$ext"

      # The release build's PGO training run, here against the debug server:
      # a mixed workload over both protocols with its row counts checked,
      # then a graceful stop (SIGTERM; Ctrl+Break on Windows) that must exit 0.
      # A fifth of the release size: a debug server on ARM64 runs scalar code
      # and its correlated subquery outlasted the 30 s request timeout.
      - name: Workload over both protocols, then a graceful stop
        shell: bash
        timeout-minutes: 30
        run: |
          cargo build --locked --target ${{ matrix.target }} -p pgo_train
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          "target/${{ matrix.target }}/debug/pgo_train$ext" "target/${{ matrix.target }}/debug/rasterizeddb_core$ext" --scale 0.2

  full:
    name: full suites ${{ matrix.name }}
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.full) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      # Line tables only: with full debug info the compat suite's hundred-odd
      # test executables ran the runners out of disk (linux-arm64 "No space
      # left on device" at link, linux-x86_64 lost its runner, the Windows
      # arm64 runner too) and hit MSVC's PDB size limit (LNK1180, LNK1140).
      # Backtraces keep file and line.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      # The three suites' test binaries outgrow an ubuntu runner's free disk:
      # compat's link died with "No space left on device" (ld bus error) on
      # linux-x86_64 in run 45357514504. Toolchains these jobs never use go
      # first.
      - name: Free disk space (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}

      - name: Core library tests
        run: cargo test --locked --target ${{ matrix.target }} -p rasterizeddb_core --lib --no-fail-fast

      # `--test '*'`, not `--tests`: `--tests` also reruns the library's own
      # unit tests, which the step above already ran (85 minutes on Windows).
      - name: Core integration tests
        run: cargo test --locked --target ${{ matrix.target }} -p rasterizeddb_core --test '*' --no-fail-fast

      # The core suites' test executables are done with; compat links its own
      # hundred-odd against the same libraries, which stay. Only test
      # executables (`<test>-<16 hex>`, `.exe`/`.pdb` on Windows) and
      # incremental state go: rlibs, proc macros, build scripts and their
      # outputs are kept, so nothing recompiles. Since cargo 1.100 a test
      # executable lands in debug/build/<package>/<hash>/out/, not
      # debug/deps/; both are swept.
      - name: Free the core test binaries before compat
        if: always()
        shell: bash
        run: |
          df -h . || true
          debug="target/${{ matrix.target }}/debug"
          for dir in "$debug"/deps "$debug"/build/rasterizeddb_core/*/out; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 1 -regextype posix-extended -type f ! -name 'build_script_*' ! -name 'build-script-*' \
              -regex '.*/[a-z0-9_]+-[0-9a-f]{16}(\.exe|\.pdb)?' \
              \( -name '*.exe' -o -name '*.pdb' -o -perm -u+x \) -print -delete | wc -l
          done
          rm -rf "$debug/incremental"
          df -h . || true

      - name: Compatibility suite (PostgreSQL / MySQL / SQL Server drivers)
        run: cargo test --locked --target ${{ matrix.target }} -p rasterizeddb_compat --no-fail-fast

  # The SDK crates promise semver: a patch or minor release must not break
  # code written against the last release. Compared with the release tags'
  # sources rather than crates.io, so a crate whose release never reached
  # crates.io (rasterizeddb_embedded 1.0.0) is still checked.
  semver:
    name: semver against the last release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks
        shell: bash
        run: |
          set -euo pipefail
          last() { git tag --list "$1" --sort=-v:refname | head -n1; }
          client="$(last 'client-v*')"; server="$(last 'server-v*')"
          if [ -z "$client" ]; then
            echo "::error::no client-v* tag in this checkout: there is no released client to compare with"
            exit 1
          fi
          # A server-v* tag can lag its release commit: it is pushed only when
          # the server crates publish (server-v1.0.0 waited for a crates.io
          # name lock). Both channels released from one commit so far, so the
          # client tag's sources are the server crates' last release too.
          if [ -z "$server" ]; then
            echo "::warning::no server-v* tag in this checkout; comparing the embedded SDK with $client instead"
            server="$client"
          fi
          echo "baselines: $client (client crates, rastcp), $server (embedded SDK)"
          cargo semver-checks --baseline-rev "$client" -p rastcp -p rasterizeddb_client -p rasterizeddb_client_derive
          cargo semver-checks --baseline-rev "$server" -p rasterizeddb_embedded

  package:
    name: crates package and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-gnu
      # One invocation, so the crates that depend on each other verify
      # against the packaged versions of each other (cargo >= 1.90), exactly
      # as crates.io would build them.
      # rasterizeddb_router (the client's `sharding` feature, the engine) and
      # rasterizeddb_raft (the engine's `sharding_raft`) are published too:
      # crates.io resolves optional dependencies as well, so without them the
      # client and the engine cannot be packaged at all.
      - name: cargo package (the seven published crates)
        run: >
          cargo package --locked
          -p rastcp -p rasterizeddb_router -p rasterizeddb_raft
          -p rasterizeddb_client_derive -p rasterizeddb_client
          -p rasterizeddb_core -p rasterizeddb_embedded
