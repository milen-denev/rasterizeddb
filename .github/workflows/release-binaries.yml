name: Release - server and Studio executables

# Channel 3 of 3. Tag `v<version>` (the version in
# rasterizeddb_core/Cargo.toml) builds the server and RasterizedDB Studio
# (rdb_studio) for four targets on native runners, smoke-tests each server
# binary (start, write, kill -9, restart, read), and attaches the archives
# and their SHA-256 sums to the GitHub release:
#
#   rasterizeddb-server-<version>-linux-x86_64.tar.gz     (x86-64-v3: AVX2 CPUs)
#   rasterizeddb-server-<version>-linux-arm64.tar.gz      (armv8-a)
#   rasterizeddb-server-<version>-windows-x86_64.zip      (x86-64-v3: AVX2 CPUs)
#   rasterizeddb-server-<version>-windows-arm64.zip       (armv8-a)
#   rasterizeddb-server-<version>-linux-x86_64-musl.tar.gz  (static, for Alpine)
#   rasterizeddb-server-<version>-linux-arm64-musl.tar.gz   (static, for Alpine)
#   rdb-studio-<version>-<the four glibc/MSVC platforms>.tar.gz / .zip
#   rasterizeddb-bin-<version>-1-x86_64.pkg.tar.zst         (Arch / CachyOS)
#   rasterizeddb-bin-aur-<version>.tar.gz                   (its AUR sources)
#
# and pushes the container images to ghcr.io (the `docker` job below).
#
# Studio is a desktop application (iced): it is built in the release profile
# without PGO, and only built here, since it cannot start without a display.
# Its archives carry the release's version; rdb_studio is versioned with the
# server (1.0.0 at the first release).
#
# Every binary is built with profile-guided optimisation: an instrumented
# build runs pgo_train's workload (both protocols, loads, point reads and
# writes, scans, aggregates, joins, transactions), and the release build uses
# that profile. Linux binaries are then BOLTed, trained the same way
# (.github/scripts/pgo-build.sh).
#
# Linux builds link glibc dynamically and run on glibc 2.39 or newer
# (Ubuntu 24.04, Debian 13, RHEL 10). Run it by hand to build and test
# the binaries without making a release; a pull request that changes the
# build runs it too, also without a release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release-binaries.yml"
      - ".github/scripts/pgo-build.sh"
      - ".github/scripts/smoke.sh"
      - "pgo_train/**"
  workflow_dispatch:
    inputs:
      pgo:
        description: "Build with PGO (and BOLT on Linux); off builds a plain release binary"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "33554432"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Three release builds with fat LTO (instrumented, optimised, plus the
    # training driver) and two training runs.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, archive: tar.gz, studio: true }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz, studio: true }
          - { name: windows-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc, archive: zip, studio: true }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, archive: zip, studio: true }
          # Static musl servers, for the Alpine image (and any Linux without
          # glibc 2.39). No Studio: a desktop app is not built statically.
          - { name: linux-x86_64-musl, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, archive: tar.gz, studio: false }
          - { name: linux-arm64-musl, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, archive: tar.gz, studio: false }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}

      # aws-lc, ring, zstd and mimalloc compile C for the target: musl's gcc
      # wrapper on the native runner of each architecture.
      - name: musl C toolchain
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          triple="$(echo '${{ matrix.target }}' | tr '-' '_')"
          echo "CC_$triple=musl-gcc" >> "$GITHUB_ENV"

      # A pre-release tag (v1.0.0-rc.1) matches the version without its
      # suffix and makes a GitHub pre-release.
      - name: The tag matches the server version
        if: github.event_name == 'push'
        shell: bash
        env:
          ALLOW_PRERELEASE: 1
        run: bash .github/scripts/check-version.sh v rasterizeddb_core

      # Per-target rustflags (32 MiB main-thread stack; x86-64-v3 on x86-64)
      # come from .cargo/config.toml, so RUSTFLAGS must stay unset here;
      # pgo-build.sh adds its flags with --config, which appends to them.
      - name: PGO and BOLT tools
        if: github.event_name != 'workflow_dispatch' || inputs.pgo
        shell: bash
        run: |
          rustup component add llvm-tools
          if [ "${{ runner.os }}" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q bolt-20
            echo "LLVM_BOLT=$(command -v llvm-bolt-20 || echo /usr/lib/llvm-20/bin/llvm-bolt)" >> "$GITHUB_ENV"
          fi

      - name: Build (release profile, fat LTO, PGO; BOLT on Linux)
        if: github.event_name != 'workflow_dispatch' || inputs.pgo
        shell: bash
        run: bash .github/scripts/pgo-build.sh ${{ matrix.target }}

      - name: Build (release profile, fat LTO, no PGO)
        if: github.event_name == 'workflow_dispatch' && !inputs.pgo
        run: cargo build --locked --release --target ${{ matrix.target }} -p rasterizeddb_core --bin rasterizeddb_core

      - name: Smoke test the release binary
        shell: bash
        run: |
          cargo build --locked --target ${{ matrix.target }} -p rasterizeddb_client --example quickstart
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          bash .github/scripts/smoke.sh \
            "target/${{ matrix.target }}/release/rasterizeddb_core$ext" \
            "target/${{ matrix.target }}/debug/examples/quickstart$ext"

      # Studio: the release profile, no PGO (its time goes to the GPU and the
      # network, not to code a training run would cover). Built, not run: it
      # opens a window at start.
      - name: Build RasterizedDB Studio (release profile)
        if: matrix.studio
        run: cargo build --locked --release --target ${{ matrix.target }} -p rdb_studio

      - name: Package
        id: package
        shell: bash
        run: |
          version="$(cargo pkgid -p rasterizeddb_core | sed 's/.*[#@]//')"
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          # pack <name>: archives dist/<name> as the matrix says, prints the file.
          pack() {
            if [ "${{ matrix.archive }}" = zip ]; then
              pwsh -NoProfile -Command "Compress-Archive -Path '$1' -DestinationPath '$1.zip'" >/dev/null
              echo "dist/$1.zip"
            else
              tar czf "$1.tar.gz" "$1" >/dev/null
              echo "dist/$1.tar.gz"
            fi
          }
          server="rasterizeddb-server-$version-${{ matrix.name }}"
          mkdir -p "dist/$server"
          cp "target/${{ matrix.target }}/release/rasterizeddb_core$ext" "dist/$server/rasterizeddb$ext"
          cp README.md LICENSE-GPL "dist/$server/"
          cd dist
          echo "server=$(pack "$server")" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.studio }}" = true ]; then
            studio="rdb-studio-$version-${{ matrix.name }}"
            mkdir -p "$studio"
            cp "../target/${{ matrix.target }}/release/rdb_studio$ext" "$studio/rdb-studio$ext"
            cp ../rdb_studio/README.md "$studio/README.md"
            cp ../LICENSE-GPL "$studio/"
            echo "studio=$(pack "$studio")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.package.outputs.server }}
            ${{ steps.package.outputs.studio }}
          if-no-files-found: error

  # Container images, ghcr.io/<owner>/rasterizeddb and (when the variable
  # DOCKERHUB_USERNAME is set) docker.io/<that user>/rasterizeddb, for linux/amd64 and
  # linux/arm64, from the binaries the build job made (no compiling here):
  #
  #   <version>-ubuntu24.04  <version>  <minor>  <major>  latest   (the default)
  #   <version>-ubuntu26.04
  #   <version>-alpine      (the static musl server)
  #   <version>-rustfs      (the musl server with RustFS: backups and S3 tables)
  #
  # plus <minor>-<variant> and <variant>. A pre-release gets only its exact
  # version tags. Each variant's amd64 image is smoke-tested before the push
  # (.github/scripts/docker-smoke.sh); pushes happen only for a tag.
  docker:
    name: image ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: ubuntu24.04, file: Dockerfile.ubuntu, args: "BASE=ubuntu:24.04", smoke: docker-smoke.sh, default: true }
          - { variant: ubuntu26.04, file: Dockerfile.ubuntu, args: "BASE=ubuntu:26.04", smoke: docker-smoke.sh, default: false }
          - { variant: alpine, file: Dockerfile.alpine, args: "BASE=alpine:3", smoke: docker-smoke.sh, default: false }
          # The server with RustFS (S3 storage) in one container, on the
          # official RustFS image: backups and S3-backed tables on board.
          - { variant: rustfs, file: Dockerfile.rustfs, args: "RUSTFS_VERSION=1.0.6", smoke: docker-smoke-rustfs.sh, default: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: linux-*
          merge-multiple: true

      - name: Binaries into the build context
        shell: bash
        run: |
          set -euo pipefail
          # take <archive suffix> <context dir>
          take() {
            mkdir -p "docker/$2"
            tar xzf artifacts/rasterizeddb-server-*-"$1".tar.gz -C "docker/$2" \
              --strip-components=1 --wildcards '*/rasterizeddb'
          }
          take linux-x86_64 bin/amd64
          take linux-arm64 bin/arm64
          take linux-x86_64-musl bin-musl/amd64
          take linux-arm64-musl bin-musl/arm64
          cp README.md LICENSE-GPL docker/
          file docker/bin*/*/rasterizeddb

      # The version comes from the tag (v1.0.1-rc.1 -> 1.0.1-rc.1): Cargo.toml
      # never carries a pre-release suffix, so reading it there would give a
      # release candidate the full release's tags, `latest` included. Docker
      # Hub gets the same tags when the repository variable DOCKERHUB_USERNAME
      # is set (with the secret DOCKERHUB_TOKEN).
      - name: Tags
        id: tags
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p rasterizeddb_core | sed 's/.*[#@]//')"
          fi
          images="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rasterizeddb"
          if [ -n "$DOCKERHUB_USERNAME" ]; then images="$images docker.io/${DOCKERHUB_USERNAME,,}/rasterizeddb"; fi
          variant="${{ matrix.variant }}"
          tags=""
          add() { local image; for image in $images; do tags="${tags:+$tags,}$image:$1"; done; }
          add "$version-$variant"
          case "$version" in
            *-*)
              if [ "${{ matrix.default }}" = true ]; then add "$version"; fi ;;
            *)
              minor="${version%.*}"; major="${version%%.*}"
              add "$minor-$variant"; add "$variant"
              if [ "${{ matrix.default }}" = true ]; then
                add "$version"; add "$minor"; add "$major"; add latest
              fi ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags" | tr , '\n'

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/${{ matrix.file }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64
          load: true
          tags: rasterizeddb-smoke:${{ matrix.variant }}

      - name: Smoke test the image
        run: bash .github/scripts/${{ matrix.smoke }} rasterizeddb-smoke:${{ matrix.variant }}

      - name: Log in to the GitHub container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build both architectures (pushed for a tag)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/${{ matrix.file }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=RasterizedDB
            org.opencontainers.image.description=RasterizedDB server (${{ matrix.variant }})
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-only

  # Docker Hub's Overview tab: docs/docker.md (tags, running, flags,
  # compose, the RustFS image), its links to other docs made absolute so they
  # resolve there. For a full release only, after its images are pushed; a
  # pre-release leaves the page on the last release's text. GHCR reads the
  # images' org.opencontainers labels instead and needs nothing here.
  #
  # Docker Hub accepts a description only from a token with the Read, Write,
  # Delete scope (a push-only token is refused). A refusal does not fail the
  # release: the images are already pushed by then.
  dockerhub-overview:
    name: Docker Hub overview
    needs: docker
    if: github.event_name == 'push' && vars.DOCKERHUB_USERNAME != '' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: The overview, its links absolute
        run: |
          sed -E 's#\]\(([A-Za-z0-9_./-]+\.md)(\#[^)]*)?\)#](https://github.com/${{ github.repository }}/blob/main/docs/\1\2)#g' \
            docs/docker.md > "$RUNNER_TEMP/dockerhub-overview.md"
          grep -n '](' "$RUNNER_TEMP/dockerhub-overview.md" | grep -v -E '\]\((https?://|#)' && exit 1 || true
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/rasterizeddb
          short-description: "SQL database in Rust: PostgreSQL, MySQL, SQL Server and native wire protocols"
          readme-filepath: ${{ runner.temp }}/dockerhub-overview.md

  # The Arch Linux / CachyOS package, rasterizeddb-bin, built with makepkg in
  # an Arch container from packaging/arch and the linux-x86_64 archive, then
  # installed there and run. The release gets the .pkg.tar.zst and an AUR
  # source tarball (PKGBUILD with real checksums, .SRCINFO, its files).
  pacman:
    name: Arch / CachyOS package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git pacman-contrib namcap
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts

      - name: makepkg
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(ls artifacts/rasterizeddb-server-*-linux-x86_64.tar.gz)"
          tag="$(basename "$tarball")"; tag="${tag#rasterizeddb-server-}"; tag="${tag%-linux-x86_64.tar.gz}"
          work=/tmp/pkg && mkdir -p "$work"
          cp packaging/arch/* "$tarball" "$work/"
          sed -i "s/^_tag=.*/_tag=$tag/" "$work/PKGBUILD"
          useradd -m builder && chown -R builder "$work"
          # updpkgsums finds the archive beside the PKGBUILD and downloads nothing.
          su builder -c "cd $work && updpkgsums && makepkg --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO"
          namcap "$work"/rasterizeddb-bin-*.pkg.tar.zst || true
          pacman -U --noconfirm "$work"/rasterizeddb-bin-*.pkg.tar.zst
          rasterizeddb --version
          pacman -Ql rasterizeddb-bin
          mkdir -p dist "dist/rasterizeddb-bin-aur-$tag"
          cp "$work"/rasterizeddb-bin-*.pkg.tar.zst dist/
          cp "$work"/{PKGBUILD,.SRCINFO,rasterizeddb.service,rasterizeddb.sysusers,rasterizeddb.env,rasterizeddb.install} "dist/rasterizeddb-bin-aur-$tag/"
          tar czf "dist/rasterizeddb-bin-aur-$tag.tar.gz" -C dist "rasterizeddb-bin-aur-$tag"
          rm -r "dist/rasterizeddb-bin-aur-$tag"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, pacman]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum rasterizeddb-server-* rdb-studio-* rasterizeddb-bin-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: "RasterizedDB ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/rasterizeddb-server-*
            dist/rdb-studio-*
            dist/rasterizeddb-bin-*
            dist/SHA256SUMS
          body: |
            The RasterizedDB server for Linux and Windows, x86-64 and ARM64.

            | Platform | Archive | CPU |
            |---|---|---|
            | Linux x86-64 | `linux-x86_64.tar.gz` | x86-64-v3 (AVX2: Intel Haswell / AMD Excavator or later) |
            | Linux ARM64 | `linux-arm64.tar.gz` | any ARMv8-A |
            | Windows x86-64 | `windows-x86_64.zip` | x86-64-v3 (AVX2) |
            | Windows ARM64 | `windows-arm64.zip` | any ARMv8-A |
            | Linux x86-64, static (musl) | `linux-x86_64-musl.tar.gz` | x86-64-v3 (AVX2) |
            | Linux ARM64, static (musl) | `linux-arm64-musl.tar.gz` | any ARMv8-A |

            Built with fat LTO and profile-guided optimisation; the glibc Linux binaries are also optimised with BOLT and need glibc 2.39+. The static musl binaries run on any Linux (Alpine included) and use mimalloc. Start with `rasterizeddb --location <dir>` (or `--in-memory`); `rasterizeddb --help` lists every option. Verify a download with `sha256sum -c SHA256SUMS`.

            **Container images** (linux/amd64 and linux/arm64), on Docker Hub as `${{ vars.DOCKERHUB_USERNAME }}/rasterizeddb` and on `ghcr.io/${{ github.repository_owner }}/rasterizeddb`: `<version>` on Ubuntu 24.04 (also `<version>-ubuntu24.04`), `<version>-ubuntu26.04`, `<version>-alpine`, and `<version>-rustfs`, which runs RustFS beside the server for its backups and S3-backed tables. Run with `docker run -e RASTERIZEDDB_PG_PASSWORD=<password> -p 5432:5432 -p 61170:61170 -v rasterizeddb:/var/lib/rasterizeddb ${{ vars.DOCKERHUB_USERNAME }}/rasterizeddb:<version>`; see docs/docker.md.

            **Arch Linux / CachyOS** (x86-64-v3): `sudo pacman -U rasterizeddb-bin-*.pkg.tar.zst`, set the password in `/etc/rasterizeddb/rasterizeddb.env`, then `sudo systemctl enable --now rasterizeddb`. `rasterizeddb-bin-aur-*.tar.gz` holds the same PKGBUILD for the AUR.

            **RasterizedDB Studio** (`rdb-studio-*`), the desktop console for RasterizedDB and PostgreSQL, is in the same four builds: dashboard, tables and schema, data editing, queries, activity, benchmarks, backups, branches, replication, migration, key/value browsing, roles and configuration. Run `rdb-studio` (`rdb-studio.exe` on Windows). It needs a desktop session: on Linux a Wayland or X11 session with a Vulkan or OpenGL driver, glibc 2.39+; the x86-64 builds need an AVX2 CPU like the server. Saved passwords go to the OS credential store (the Secret Service on Linux, Credential Manager on Windows).
