name: Windows iterate (temporary)

# TEMPORARY, for the Windows fix round on fix/windows-suite: runs the core
# library modules that failed on Windows, on both Windows runners, on every
# push to that branch's pull request. Removed before the branch merges.

on:
  pull_request:

concurrency:
  group: windows-iterate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_MIN_STACK: "33554432"
  RUST_BACKTRACE: "1"

jobs:
  core-lib:
    if: github.head_ref == 'fix/windows-suite'
    name: core lib ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
      - name: Directory flush on this runner
        run: cargo test --locked --target ${{ matrix.target }} -p rasterizeddb_core --lib core::sync_path -- --nocapture
      - name: The modules that failed
        run: >
          cargo test --locked --target ${{ matrix.target }} -p rasterizeddb_core --lib --no-fail-fast --
          core::auto_compact core::backup core::database core::index::paged core::index_store
          core::kv_cache core::mvcc::status core::partition core::power_loss
          core::processor::column_scan_tests core::row::write_path_tests core::rql::row_source
          core::storage core::storage_providers core::torn_tail core::wal
          pgwire::branch_tests pgwire::index_store_wire_tests
