name: Release - client crates

# Channel 1 of 3. Tag `client-v<version>` (the version in
# rasterizeddb_client/Cargo.toml) publishes, in order:
#   rastcp (when its version is not on crates.io yet)
#   rasterizeddb_client_derive
#   rasterizeddb_client
# and creates the GitHub release for the tag. The .NET driver and EF Core
# provider (dotnet/: RasterizedDb.Data, RasterizedDb.EntityFrameworkCore) go to
# nuget.org at the same version, from the `nuget` job.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io token with
# publish-new and publish-update scopes), and for NuGet either the secret
# NUGET_API_KEY (a nuget.org key scoped to push RasterizedDb.*) or nuget.org
# Trusted Publishing (a policy for this repository, workflow file
# release-client.yml, environment `nuget`, plus the repository variable
# NUGET_USER, the nuget.org account that owns the packages). The job runs in
# the GitHub environment `nuget`, which must exist. Run it by hand with
# dry_run to see what would be published without publishing.

on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "33554432"

jobs:
  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc }
          # Every feature but `fips`: aws-lc-fips-sys does not build for
          # Windows ARM64 (its CMake run asks Ninja for an ARM64 platform,
          # which Ninja refuses), and AWS-LC's FIPS module has no such target.
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc,
              features: "--features rastcp/tls-keylog,rasterizeddb_client/derive,rasterizeddb_client/sharding,rasterizeddb_client/broker,rasterizeddb_client/fault_points,rasterizeddb_client/chrono,rasterizeddb_client/uuid,rasterizeddb_client/serde_json" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
      - name: Test
        run: >
          cargo test --locked --target ${{ matrix.target }}
          -p rastcp -p rasterizeddb_client_derive -p rasterizeddb_client ${{ matrix.features || '--all-features' }}
      - name: Live tests against this tree's server (unix only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --target ${{ matrix.target }} -p rasterizeddb_core --bin rasterizeddb_core
          RDB_SERVER_BIN="$PWD/target/${{ matrix.target }}/debug/rasterizeddb_core" \
            cargo test --locked --target ${{ matrix.target }} -p rasterizeddb_client --all-features

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-gnu

      - name: The tag matches the crate versions
        if: github.event_name == 'push'
        run: bash .github/scripts/check-version.sh client-v rasterizeddb_client rasterizeddb_client_derive

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: >
          cargo package --locked
          -p rastcp -p rasterizeddb_mq -p rasterizeddb_router -p rasterizeddb_client_derive -p rasterizeddb_client

      - name: Publish to crates.io
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/scripts/publish-crates.sh rastcp rasterizeddb_mq rasterizeddb_router rasterizeddb_client_derive rasterizeddb_client

      - name: GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: "Client SDK ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            The native-protocol client SDK, published to crates.io:

            - [`rasterizeddb_client`](https://crates.io/crates/rasterizeddb_client) - client, ORM, migrations, key/value API ([docs](https://docs.rs/rasterizeddb_client))
            - [`rasterizeddb_client_derive`](https://crates.io/crates/rasterizeddb_client_derive) - `#[derive(Model, FromRow, SqlEnum)]`
            - [`rastcp`](https://crates.io/crates/rastcp) - the transport both client and server use

            ```toml
            [dependencies]
            rasterizeddb_client = "<version>"  # this tag without the client-v prefix
            ```

  # RasterizedDb.Data and RasterizedDb.EntityFrameworkCore to nuget.org, at the
  # tag's version (client-v1.2.3 -> 1.2.3), after the crates. nuget.org
  # Trusted Publishing: NuGet/login exchanges this job's GitHub OIDC token for
  # a short-lived API key, which needs `id-token: write` and the `nuget`
  # environment named in the nuget.org policy. A dry run only packs.
  nuget:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      # Job-level so a step's `if:` can see whether a key is stored.
      STORED_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            v="${GITHUB_REF_NAME#client-v}"
          else
            v="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/Directory.Build.props | head -1)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "packing $v"

      # The published packages by name, not the solution (its test projects
      # are in it too).
      - name: Pack
        shell: bash
        run: |
          for p in RasterizedDb.Data RasterizedDb.EntityFrameworkCore RasterizedDb.Messaging; do
            dotnet pack "dotnet/src/$p/$p.csproj" -c Release \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:ContinuousIntegrationBuild=true \
              --output nupkgs
          done

      - name: The packages
        run: ls -l nupkgs

      # A stored key (secret NUGET_API_KEY, scoped to push RasterizedDb.*) is
      # used when there is one; otherwise Trusted Publishing gives a
      # short-lived key for this run.
      - name: NuGet login (Trusted Publishing, when no key is stored)
        if: (github.event_name == 'push' || !inputs.dry_run) && env.STORED_KEY == ''
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          NUGET_KEY: ${{ env.STORED_KEY != '' && env.STORED_KEY || steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key "$NUGET_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
