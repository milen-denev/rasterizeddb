name: Rust toolchain and build tools
description: Stable Rust for one target, the C toolchain its native crates need, and a build cache.
inputs:
  target:
    description: Rust target triple
    required: true
runs:
  using: composite
  steps:
    # The engine's tests create, sync and delete thousands of small files.
    # On the Windows runners Defender scans each one: file-heavy tests ran
    # 8-23x slower than on Linux while CPU- and network-bound tests ran at
    # the same speed. The runners are throwaway VMs, so real-time scanning is
    # turned off where the image allows it (windows-2025: the library suite
    # went from 85 to 33 minutes). windows-11-arm has Tamper Protection, which
    # ignores that silently; there the temp directory, where every test's
    # tempdir lives, moves to a trusted Dev Drive (ReFS, scanned
    # asynchronously), on every Windows runner alike. Best effort: a refused
    # setting leaves the job as slow as before.
    - name: Windows - Defender real-time scanning off
      if: runner.os == 'Windows'
      shell: pwsh
      continue-on-error: true
      run: |
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Continue
        foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")) {
          Add-MpPreference -ExclusionPath $p -ErrorAction Continue
        }
        Get-MpComputerStatus | Format-List AMRunningMode, RealTimeProtectionEnabled, IsTamperProtected

    - name: Windows - Dev Drive for the temp directory
      if: runner.os == 'Windows'
      uses: samypr100/setup-dev-drive@v4.1.0
      with:
        drive-size: 40GB
        drive-format: ReFS
        drive-type: Dynamic
        trusted-dev-drive: true
        env-mapping: |
          TEMP,{{ DEV_DRIVE }}/tmp
          TMP,{{ DEV_DRIVE }}/tmp

    - name: Windows - temp directory on the Dev Drive
      if: runner.os == 'Windows'
      shell: pwsh
      continue-on-error: true
      run: |
        New-Item -ItemType Directory -Force $env:TEMP | Out-Null
        Add-MpPreference -ExclusionPath $env:DEV_DRIVE -ErrorAction Continue
        "TEMP=$env:TEMP"
        fsutil devdrv query $env:DEV_DRIVE
        Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free, Root

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    # aws-lc-sys (rustls' provider, and rcgen's) and ring build C and
    # assembly. On Windows ARM64 that needs clang; the image usually has
    # LLVM, and this installs it when it does not.
    - name: clang for Windows ARM64
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: pwsh
      run: |
        if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
          choco install llvm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.target }}
