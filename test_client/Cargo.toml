[package]
name = "test_client"
version = "0.1.0"
edition = "2024"
# A developer's load driver, never released.
publish = false

[dependencies]
# The engine, for the in-memory row generator (menu option 4).
rasterizeddb_core = { path = "../rasterizeddb_core" }
# The native protocol's client, for everything that talks to a server.
rasterizeddb_client = { path = "../rasterizeddb_client", default-features = false }
tokio = { version = "1", features = ["full"] }
stopwatch = "0.0.7"
env_logger = "0.11"
log = "0.4"
rand = "0.10"
futures = "0.3"
rclite = "0.4.2"

[features]
default = []
enable_long_row = ["rasterizeddb_core/enable_long_row"]
enable_data_verification = ["rasterizeddb_core/enable_data_verification"]