[package]
name = "rastcp"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
rustls = { version = "0.23" }
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
bytes = "1.12"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
time = "0.3"
socket2 = "0.6"
webpki-roots = { version = "1.0" }
cacheguard = "0.1.0"
xutex = "0.2.1"
libc = "0.2"
sha2 = "0.11"
subtle = "2.6"

[features]
default = []
# Write TLS session keys to the path in SSLKEYLOGFILE, so a capture can be
# decrypted in Wireshark. A debugging aid only: anyone who can read that file
# can decrypt every session it covers.
tls-keylog = []

[dev-dependencies]
serde_json = "1.0.154"
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = "1.29.2"
