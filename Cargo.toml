[workspace]
members = [ "rastcp","rasterizeddb_core", "rasterizeddb_compat", "rasterizeddb_filter_tests", "test_client", "test_db_web", "rdb_studio"]
resolver = "3"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 1
lto = "fat"

[profile.dev_opt3]
strip = "none"
inherits = "dev"
opt-level = 3
codegen-units = 1
lto = "thin"
overflow-checks = false
incremental = false
