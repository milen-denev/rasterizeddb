[package]
name = "rasterizeddb_client"
version = "0.2.0"
edition = "2024"
description = "A client SDK and ORM for RasterizedDB's native protocol that does not compile the engine"

# What a client needs and nothing else: the transport, a runtime, and libc for
# the operating-system user a peer login names (and the OS random source for
# UUIDs). The row format and the literal rules are this crate's own copies of
# the server's; the tests in `tests/` run them against a real server so the
# copies cannot drift unnoticed.
[dependencies]
rastcp = { path = "../rastcp" }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
libc = "0.2"
rasterizeddb_client_derive = { path = "../rasterizeddb_client_derive", version = "0.2.0", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
uuid = { version = "1", default-features = false, optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["derive"]
# `#[derive(Model)]`, `#[derive(FromRow)]` and `#[derive(SqlEnum)]`.
derive = ["dep:rasterizeddb_client_derive"]
# ToSql/FromSql for chrono's DateTime<Utc>, NaiveDateTime, NaiveDate, NaiveTime.
chrono = ["dep:chrono"]
# ToSql/FromSql for uuid::Uuid.
uuid = ["dep:uuid"]
# FromSql for serde_json::Value, Json::from_value / Json::parse, and
# `#[rdb(json)]` model fields of any Serialize + Deserialize type.
serde_json = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
serde = { version = "1", features = ["derive"] }
