[package]
name = "rasterizeddb_core"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/milen-denev/rasterizeddb"
license = "GPL-3.0-only"
keywords = ["database", "embedded-database"]
authors = ["Milen Denev"]
description = "A schemafull, high-performance database written in Rust, designed for speed and scalability."

[dependencies]
tokio = { version = "1", features = ["full"] }
byteorder = "1.5"
itertools = "0.15"
ahash = "0.8"
# `HashTable<u32>` for the hash-join build side: indices only, keys read back from the rows.
hashbrown = { version = "0.16", default-features = false }
# Bulk scanning of SQL text for the next quote/placeholder byte.
memchr = "2"
once_cell = "1.21.3"
orx-concurrent-vec = "3.10"
stopwatch = "0.0.7"
futures = "0.3"
async-lazy = { version = "0.1", features = ["parking_lot"] }
dashmap = "6.1"
# Release builds compile `trace!` out entirely, so the hot-path level checks
# cost nothing. `debug` is kept: `--log-level debug` is the documented way to
# see statement text on a live node (pgwire's `Statement:` line). Production
# defaults to `error`. Note this is unified across the dependency graph, so
# `--log-level trace` in a release build shows at most debug.
log = { version = "0.4", features = ["release_max_level_debug"] }
libmimalloc-sys = "0.1"
rastcp = { path = "../rastcp" }
env_logger = "0.11"
crc = "3.4"
# CRC-32/ISO-HDLC with PCLMULQDQ: the WAL, replication log, backup archives and
# KV layout checksums all run through it. Same polynomial as `crc`'s, ~30x the
# throughput of its default byte-at-a-time table.
crc32fast = "1.5"
temp_testdir = "0.2"
memmap2 = "0.9"
rand = "0.10"
memory-stats = "1.2"
smallvec = { version = "1.15", features = ["union", "write"]}
arc-swap = "1.8"
fastrand = "2.3"
parking_lot = "0.12"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
kanal = "0.1"
rclite = "0.4.1"
opool = "0.2.0"
cacheguard = "0.1.0"
xutex = "0.2.1"
branches = "0.4.4"

# pgwire TLS
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"

# pgwire authentication: SCRAM-SHA-256, and MD5 for older clients.
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
md-5 = "0.11"
base64 = "0.23"
subtle = "2.6"

# NOTE: Cargo does not support `cfg(debug_assertions)` for platform-specific dependencies.
# These are always available, but only used behind `#[cfg(debug_assertions)]` in code.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- s3_backup feature only ---
# zstd carries the whole snapshot and every archived log segment. It is the
# only new code pulled in: the S3 client is built on rustls/tokio-rustls/sha2/
# hmac/base64, which the pgwire listener already required.
zstd = { version = "0.13", optional = true, features = ["zstdmt"] }
# Root certificates for the *client* side of TLS. `rustls` ships none, and
# rustls-native-certs would add a platform dependency for a store the server
# has no other use for.
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.8" }
tempfile = "3"

[[bench]]
name = "string_instructions_benchmarks"
harness = false

[[bench]]
name = "query_benchmarks"
harness = false

[[bench]]
name = "query_executor_benchmarks"
harness = false

[[bench]]
name = "simd_copy_benchmarks"
harness = false

[[bench]]
name = "atomic_cache_benchmarks"
harness = false

[[bench]]
name = "file_sync_benchmarks"
harness = false

[[bench]]
name = "server_cache_repeated_query_benchmarks"
harness = false

[[bench]]
name = "hotspot_benchmarks"
harness = false

[[bench]]
name = "row_path_benchmarks"
harness = false

[[bench]]
name = "filter_benchmarks"
harness = false

[[bench]]
name = "mmap_scan_benchmarks"
harness = false

[[bench]]
name = "append_benchmarks"
harness = false

[[bench]]
name = "vacuum_benchmarks"
harness = false

[features]
default = ["memory_pool_reuse", "replication_compression", "s3_backup", "pg_import", "storage_pools", "kv_storage", "kv_storage_s3", "query_stats", "kv_cache", "persistent_indexes"]
enable_long_row = []

# Indexes and the filter persisted as snapshots taken at clean points, loaded
# at open instead of rebuilt (docs/persistent-indexes.md).
#
# On by default. A directory that has used them carries `index_store_v1` in
# its `incompat_features` file, and a build without this feature refuses that
# directory rather than open files it would not keep correct. It adds no crate
# of its own.
persistent_indexes = []
enable_data_verification = []
memory_pool_reuse = []

# Compressed transaction exchange between replicating instances.
#
# On by default. Turning it off drops the codec, and a node built without it
# still interoperates with one that has it — the handshake only ever picks a
# codec both ends advertise, so the link falls back to uncompressed.
replication_compression = ["dep:zstd"]

# One-way import of a live PostgreSQL database: schema, then data.
#
# Off by default. It is the only feature that makes this process a *client* of
# another database, and a build that never migrates should not carry a second
# wire protocol. It adds no crate of its own — the PostgreSQL frontend protocol
# is spoken over the `rustls`/`tokio` the pgwire listener already needs, and the
# SCRAM exchange reuses `auth::ScramClient` — except the root certificates that
# `sslmode=verify-full` checks a server against, which `s3_backup` also pulls.
pg_import = ["dep:webpki-roots"]

# Several storage directories for one database, with a policy that decides
# which of them a new table's files are created in, and mirrored backup
# locations.
#
# Off by default. A database that only ever writes into one directory should not
# carry the placement machinery, the mirroring provider, or the extra match arm
# on every storage call — and with the feature off the pool type collapses to
# `()` and all of it compiles away. It adds no crate of its own: free space
# comes from `statvfs` through the `libc` already in the tree, and the pool file
# is tab-separated text rather than a serialisation format.
storage_pools = []

# A database kept in a key/value store instead of in files.
#
# Off by default. It is a whole second storage backend — chunked objects, a
# delta log, a page cache and a compactor — and a build that only ever writes
# files should not carry it or the extra match arm on every storage call. It
# adds no crate of its own: the backing store is a trait, and the two
# implementations it ships with (a map, a directory) need nothing new.
kv_storage = []

# The S3 backing store for `kv_storage`.
#
# Separate from `kv_storage` because that feature is useful without a network —
# it is how the driver is tested — and because this one pulls the SigV4 client
# and root certificates that `s3_backup` owns.
kv_storage_s3 = ["kv_storage", "s3_backup"]

# What ran recently, what it cost, and how much of each table it read:
# `SHOW QUERIES`, `SHOW QUERY STATS` and `pg_stat_statements`.
#
# On by default, unlike the rest of these, because a server whose statements
# cannot be seen cannot be diagnosed and the price is one mutex acquisition per
# statement plus one relaxed atomic add per batch of ten thousand rows scanned.
# It is still a feature so a build that measures elsewhere can drop the ring
# buffer, the aggregate map and the task-local entirely. It adds no crate of its
# own: the ring is a `VecDeque` behind the `parking_lot` already in the tree, and
# the timestamps go through the calendar arithmetic `pg_params` already has.
query_stats = []

# A Redis-compatible key/value store inside the database: `KV …` statements on
# the PostgreSQL port, and the Redis protocol itself on `--kv-port`.
#
# It adds no crate of its own. The store is hashbrown tables behind the
# `parking_lot` locks already in the tree, the protocol is spoken over the
# `tokio` the other listeners use, and `AUTH` checks the database's own roles
# through `auth`. Nothing is allocated until the first `KV` statement or RESP
# connection, and the port is closed unless `--kv-port` is given.
kv_cache = []

# Snapshot + point-in-time backup to any S3-compatible object store.
#
# Off by default: it is the only feature that opens an outbound network
# connection, and a build that never backs up should not carry a compressor,
# a root certificate bundle, or the code that signs requests.
s3_backup = ["dep:zstd", "dep:webpki-roots"]