[package]
name = "rdb_studio"
version = "1.0.0"
edition = "2024"
description = "A database console for RasterizedDB and PostgreSQL"
license = "GPL-3.0"

[build-dependencies]
# The icon and version resource of the Windows executable (build.rs).
winresource = "0.1.34"

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "canvas", "advanced"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
tokio-postgres = "0.7.18"
# The native protocol (rastcp), the default for a RasterizedDB profile.
rasterizeddb_client = { path = "../rasterizeddb_client", default-features = false }
# The LEDGER page (licensed, sharding-plan.md §10 L8): only with `enterprise`.
rdb_studio_enterprise = { path = "../rdb_studio_enterprise", optional = true }
# The trait a wire result streams through, read row by row under the
# editor's row limit (already in the tree through tokio-postgres).
futures-core = "0.3"
tokio-postgres-rustls = "0.14.0"
# The public roots a profile set to verify the server checks against when it
# names no CA file (the version rastcp already uses).
webpki-roots = "1.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7"
# Saved passwords go to the OS credential store: Keychain on macOS, Credential
# Manager on Windows, the Secret Service (over the zbus already in the tree)
# elsewhere.
keyring = "4.2.0"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }

[features]
default = []
# The enterprise pages: ledger tables and secret vaults.
enterprise = ["dep:rdb_studio_enterprise"]
