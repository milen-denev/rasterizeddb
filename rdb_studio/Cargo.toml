[package]
name = "rdb_studio"
version = "0.1.0"
edition = "2024"
description = "A database console for RasterizedDB and PostgreSQL"
license = "GPL-3.0"

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "canvas", "advanced"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "6"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
